name: Publish desktop preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Desktop packages run containing the successful artifact
        required: true
        type: string
      platform:
        description: Successful target to publish
        required: true
        type: choice
        options:
          - mac-arm64
          - mac-x64
          - linux-x64
          - win-x64

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_RUN_ID: ${{ inputs.run_id }}
      PACKAGE_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Validate source and destination
        run: |
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$PACKAGE_RUN_ID" > /tmp/source-run.json
          gh release view v3.17.1-codex.1 --json isPrerelease > /tmp/preview-release.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const run = JSON.parse(readFileSync('/tmp/source-run.json'));
          assert.equal(run.repository.full_name, process.env.GH_REPO);
          assert.equal(run.path, '.github/workflows/desktop-packages.yml');
          assert.equal(JSON.parse(readFileSync('/tmp/preview-release.json')).isPrerelease, true);
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: ZCode-Codex-${{ inputs.platform }}-*
          path: release-input
          merge-multiple: true
      - name: Verify and publish
        run: |
          cd release-input
          sha256sum --check SHA256SUMS.txt
          node --input-type=module <<'NODE'
          import { readdirSync, renameSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const patterns = { 'mac-arm64': [/\.dmg$/, /\.zip$/], 'mac-x64': [/\.dmg$/, /\.zip$/], 'win-x64': [/\.exe$/], 'linux-x64': [/\.AppImage$/, /\.deb$/, /\.rpm$/, /\.pkg\.tar\.zst$/] };
          const required = patterns[process.env.PACKAGE_PLATFORM];
          const files = readdirSync('.');
          for (const pattern of required) assert(files.some(f => pattern.test(f)), 'Missing package format: ' + pattern);
          const manifest = 'SHA256SUMS-' + process.env.PACKAGE_PLATFORM + '.txt';
          renameSync('SHA256SUMS.txt', manifest);
          const assets = files.filter(f => required.some(p => p.test(f)));
          const result = spawnSync('gh', ['release', 'upload', 'v3.17.1-codex.1', ...assets, manifest], { stdio: 'inherit' });
          assert.equal(result.status, 0, 'Release upload failed');
          NODE
