name: Publish desktop preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Codex prerelease tag at the package source commit
        required: true
        type: string
      run_id:
        description: Desktop packages run containing the successful artifact
        required: true
        type: string
      platform:
        description: Successful target to publish
        required: true
        type: choice
        options:
          - mac-arm64
          - mac-x64
          - linux-x64
          - win-x64

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_RUN_ID: ${{ inputs.run_id }}
      PACKAGE_PLATFORM: ${{ inputs.platform }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Validate source and destination
        run: |
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-codex\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$PACKAGE_RUN_ID" > /tmp/source-run.json
          gh release view "$RELEASE_TAG" --json isPrerelease > /tmp/preview-release.json
          gh api "repos/$GH_REPO/commits/$RELEASE_TAG" > /tmp/release-commit.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const run = JSON.parse(readFileSync('/tmp/source-run.json'));
          assert.equal(run.repository.full_name, process.env.GH_REPO);
          assert.equal(run.path, '.github/workflows/desktop-packages.yml');
          assert.equal(JSON.parse(readFileSync('/tmp/preview-release.json')).isPrerelease, true);
          // 发布标签必须对应构建源码，防止旧包被当作新版功能发布。
          assert.equal(run.head_sha, JSON.parse(readFileSync('/tmp/release-commit.json')).sha);
          NODE
          node -e 'const r = require("/tmp/source-run.json"); console.log("SOURCE_SHA=" + r.head_sha)' >> "$GITHUB_ENV"
      - name: Wait for target artifact
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const api = path => {
            const result = spawnSync('gh', ['api', path], { encoding: 'utf8' });
            if (result.status !== 0) throw new Error('Unable to inspect package run: ' + result.stderr);
            return JSON.parse(result.stdout);
          };
          const base = 'repos/' + process.env.GH_REPO + '/actions/runs/' + process.env.PACKAGE_RUN_ID;
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const artifacts = api(base + '/artifacts').artifacts;
            ready = artifacts.some(a => !a.expired && a.name === 'ZCode-Codex-' + process.env.PACKAGE_PLATFORM + '-' + process.env.SOURCE_SHA);
            if (ready) break;
            if (api(base).status === 'completed') throw new Error('Source run completed without this target artifact');
            console.log('Waiting for ' + process.env.PACKAGE_PLATFORM + ' artifact');
            await new Promise(resolve => setTimeout(resolve, 30000));
          }
          if (!ready) throw new Error('Target artifact wait exceeded 30 minutes');
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: ZCode-Codex-${{ inputs.platform }}-${{ env.SOURCE_SHA }}
          path: release-input
          merge-multiple: true
      - name: Verify and publish
        run: |
          cd release-input
          sha256sum --check SHA256SUMS.txt
          node --input-type=module <<'NODE'
          import { readdirSync, renameSync, readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const patterns = { 'mac-arm64': [/\.dmg$/, /\.zip$/], 'mac-x64': [/\.dmg$/, /\.zip$/], 'win-x64': [/\.exe$/], 'linux-x64': [/\.AppImage$/, /\.deb$/, /\.rpm$/, /\.pkg\.tar\.zst$/] };
          const required = patterns[process.env.PACKAGE_PLATFORM];
          const files = readdirSync('.');
          for (const pattern of required) assert(files.some(f => pattern.test(f)), 'Missing package format: ' + pattern);
          const manifest = 'SHA256SUMS-' + process.env.PACKAGE_PLATFORM + '.txt';
          // GitHub 会把附件名空格改为点号；先统一名称并同步清单，保留已校验的摘要。
          const originalAssets = files.filter(f => required.some(p => p.test(f)));
          const names = new Map(originalAssets.map(f => [f, f.replaceAll(' ', '.')]));
          const assets = [...names.values()];
          assert.equal(new Set(assets).size, assets.length, 'Normalized asset names collide');
          for (const name of assets) assert(/^[A-Za-z0-9._-]+$/.test(name), 'Unsafe asset name');
          const checksums = readFileSync('SHA256SUMS.txt', 'utf8').trim().split(/\r?\n/).map(line => {
            const match = /^([a-f0-9]{64}) {2}(.+)$/.exec(line);
            assert(match && names.has(match[2]), 'Unexpected checksum entry');
            return match[1] + '  ' + names.get(match[2]);
          });
          assert.equal(checksums.length, assets.length, 'Missing checksum entry');
          for (const [original, normalized] of names) if (original !== normalized) renameSync(original, normalized);
          writeFileSync(manifest, checksums.join('\n') + '\n');
          const result = spawnSync('gh', ['release', 'upload', process.env.RELEASE_TAG, ...assets, manifest], { stdio: 'inherit' });
          assert.equal(result.status, 0, 'Release upload failed');
          NODE
